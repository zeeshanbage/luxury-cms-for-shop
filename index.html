<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="%VITE_FAVICON_HREF%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Premium SEO Meta Tags -->
    <title>%VITE_SEO_TITLE%</title>
    <meta name="description" content="%VITE_SEO_DESCRIPTION%" />
    <meta name="theme-color" content="#030303" />

    <!-- Open Graph / WhatsApp / Social Link Previews -->
    <meta property="og:title" content="%VITE_OG_TITLE%" />
    <meta property="og:description" content="%VITE_OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_OG_URL%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="%VITE_OG_SITE_NAME%" />
    <meta property="og:locale" content="en_IN" />

    <!-- WhatsApp / Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_OG_TITLE%" />
    <meta name="twitter:description" content="%VITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
